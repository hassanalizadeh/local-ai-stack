services:
  # 1. PostgreSQL (Required for Langfuse)
  postgres:
    image: postgres:18-alpine
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Caching for LiteLLM & Queue for Langfuse)
  redis:
    image: redis:alpine
    container_name: ai_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - ai-net

  # 3. Qdrant (Vector Database for Embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_qdrant
    restart: always
    ports:
      - "${QDRANT_REST_PORT}:6333" # REST API
      - "${QDRANT_GRPC_PORT}:6334" # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - ai-net

  # 4. LiteLLM Gateway (The Proxy)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai_litellm
    restart: always
    ports:
      - "${LITELLM_PORT}:4000"
    environment:
      # host.docker.internal allows the container to talk to your Mac's native Ollama app
      - OLLAMA_API_BASE=${OLLAMA_API_BASE}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
    # Required to allow communication to the Mac host on Apple Silicon
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 5. Langfuse (Observability & Tracing)
  langfuse:
    image: langfuse/langfuse:2
    container_name: ai_langfuse
    restart: always
    ports:
      - "${LANGFUSE_PORT}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
    networks:
      - ai-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

networks:
  ai-net:
    driver: bridge
